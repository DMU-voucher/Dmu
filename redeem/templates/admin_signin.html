{% extends "_base.html" %}
{% block heading %}Admin{% endblock %}
{% block content %}
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <div class="card">
    <h2>DMU Venues sign in</h2>
    <p class="hint">For importing batches and reconciling. Not the vendor password.</p>
    <form method="post" action="{{ url_for('admin_signin_post') }}">
      <label class="field">
        <span class="lab">Admin password</span>
        <input type="password" name="password" required autofocus
               autocomplete="current-password" autocapitalize="none"
               autocorrect="off" spellcheck="false">
      </label>
      <button class="primary block" type="submit">Sign in</button>
    </form>
  </div>
{% endblock %}
