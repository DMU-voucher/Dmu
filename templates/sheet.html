<!doctype html>
{# 6 vouchers to an A4 page, with dashed cut guides. #}
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>{{ css|safe }}</style>
</head>
<body>
{% from "_voucher.html" import voucher %}
{% for page in pages %}
  <div class="sheet">
    {% for v in page %}
      <div class="cell">{{ voucher(v, cfg, logos) }}</div>
    {% endfor %}
    {% for _ in range(per_page - page|length) %}
      <div class="cell empty"></div>
    {% endfor %}
  </div>
{% endfor %}
</body>
</html>
